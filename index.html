<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A cinematic, scroll-driven love story celebrating our monthsary — an interactive digital love letter crafted with emotion and elegance."
    />
    <title>Happy 14th Monthsary ❤️</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const isGitHubPages = location.hostname.endsWith("github.io");
        const isLocalStaticServer = ["localhost", "127.0.0.1"].includes(location.hostname) && location.port !== "5173";
        const isRawViteIndex = document.querySelector('script[src="/src/main.tsx"]');
        const isAlreadyDocs = location.pathname.endsWith("/docs/") || location.pathname.includes("/docs/");

        if ((isGitHubPages || isLocalStaticServer) && isRawViteIndex && !isAlreadyDocs) {
          const basePath = location.pathname.endsWith("/")
            ? location.pathname
            : location.pathname.replace(/\/[^/]*$/, "/");
          location.replace(`${basePath}docs/`);
        }
      })();
    </script>
  </body>
</html>
